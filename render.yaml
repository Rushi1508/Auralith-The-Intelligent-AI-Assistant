services:
  - type: web
    name: auralith-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    # Not /health: that probes the DB and would keep Neon awake.
    healthCheckPath: /openapi.json
    envVars:
      - {key: AURALITH_GENERATOR_PROVIDER, value: gemini}
      - {key: AURALITH_EMBEDDING_PROVIDER, value: gemini}
      - {key: AURALITH_RERANK_PROVIDER, value: none}
      - {key: WEB_CONCURRENCY, value: "1"}
      - {key: AURALITH_MAX_INFLIGHT, value: "1"}
      - {key: PGCONNECT_TIMEOUT, value: "10"}
      - {key: DATABASE_URL, sync: false}
      - {key: GEMINI_API_KEY, sync: false}
      - {key: AURALITH_API_KEYS, sync: false}
      - {key: AURALITH_ADMINS, sync: false}
